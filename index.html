<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Watch full video 🎥" />

  <meta property="og:type" content="website" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body {
      width: 100%;
      height: 100dvh;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .video-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      aspect-ratio: 9 / 16;
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: cover;
      display: block;
    }
    .unmute-btn {
      position: fixed;
      top: 18px;
      right: 16px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #222222;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
    }
    .center-stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }
    .center-stage.hidden {
      display: none;
    }
    .play-ring-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .arc-spinner {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, 0.14);
      border-top-color: #ffffff;
      animation: spinRing 0.9s linear infinite;
      pointer-events: none;
    }
    .arc-spinner.hidden {
      display: none;
    }
    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }
    .red-play-circle {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #e11d2a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(225, 29, 42, 0.45);
    }
    .red-play-circle svg {
      width: 30px;
      height: 30px;
      margin-left: 4px;
    }
    .buffering-caption {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
      text-align: center;
    }
  </style>
</head>
<body>
  <button type="button" class="unmute-btn" id="unmuteBtn">Tap to Unmute</button>

  <div class="video-wrap">
    <video
      id="mainVideo"
      src="https://files.catbox.moe/4ut9uw.mp4"
      poster="https://i.postimg.cc/GtHgTtfm/IMG-20261125-121925.jpg"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <div class="center-stage" id="bufferingOverlay">
    <div class="play-ring-wrap">
      <div class="arc-spinner" id="spinnerRing"></div>
      <button type="button" class="red-play-circle" id="playBtn" aria-label="Play">
        <svg viewBox="0 0 36 36" aria-hidden="true">
          <polygon points="10,6 30,18 10,30" fill="#ffffff"></polygon>
        </svg>
      </button>
    </div>
    <div class="buffering-caption" id="statusText">Buffering HD Stream (99%)...</div>
  </div>

  <script>
    (function () {
      const video = document.getElementById("mainVideo");
      const overlay = document.getElementById("bufferingOverlay");
      const spinner = document.getElementById("spinnerRing");
      const playBtn = document.getElementById("playBtn");
      const statusText = document.getElementById("statusText");
      const unmuteBtn = document.getElementById("unmuteBtn");

      let videoFinished = false;

      video.loop = false;

      function showBufferingState() {
        if (videoFinished) return;
        spinner.classList.remove("hidden");
        statusText.textContent = "Buffering HD Stream (99%)...";
        overlay.classList.remove("hidden");
      }

      function showTapToPlayState() {
        videoFinished = true;
        spinner.classList.add("hidden");
        statusText.textContent = "Tap to Play";
        unmuteBtn.style.display = "none";
        overlay.classList.remove("hidden");
      }

      function hideOverlay() {
        if (videoFinished) return;
        overlay.classList.add("hidden");
      }

      video.addEventListener("playing", hideOverlay);
      video.addEventListener("waiting", showBufferingState);
      video.addEventListener("pause", function () {
        if (!video.ended && !videoFinished) {
          showBufferingState();
        }
      });
      video.addEventListener("ended", function () {
        video.pause();
        showTapToPlayState();
      });

      function handleMainTap() {
        if (videoFinished) {
          video.currentTime = 0;
          video.play().catch(function () {});
          return;
        }
        video.play().catch(function () {});
      }

      playBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        handleMainTap();
      });

      overlay.addEventListener("click", handleMainTap);

      unmuteBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        video.muted = false;
        video.play().catch(function () {});
        unmuteBtn.style.display = "none";
      });

      video.play().catch(function () {});
    })();
  </script>

</body>
</html>
